# Consulta Supabase cada 3 días para que el proyecto gratuito no se pause por inactividad.
# Usa la misma clave pública que config.js (solo lectura del catálogo).
name: Mantener Supabase activo

on:
  schedule:
    - cron: "0 12 */3 * *"   # cada 3 días, 12:00 UTC (09:00 en Argentina)
  workflow_dispatch:          # botón "Run workflow" para probarlo a mano

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar un producto
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://bybtizgxcjjtetnwsfho.supabase.co/rest/v1/productos?select=id&limit=1" \
            -H "apikey: sb_publishable_AZgdOFTrOfKgJqRt1q6YxQ_P_WsPKE2")
          echo "Respuesta de Supabase: $code"
          test "$code" = "200"
