<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogo</title>
<style>
:root{--bg:#f4f6f5;--c:#fff;--t:#14211f;--m:#5f6f6c;--a:#0f766e;--b:#dbe3e1;--ok:#166534;--no:#b91c1c}
@media(prefers-color-scheme:dark){:root{--bg:#0e1514;--c:#162120;--t:#e8f0ee;--m:#93a5a1;--b:#263634;--ok:#4ade80;--no:#f87171}}
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--t)}
main{max-width:860px;margin:auto;padding:16px}h1{margin:8px 0 12px}
input{width:100%;font:inherit;padding:11px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t)}
.w{overflow-x:auto;margin-top:12px;background:var(--c);border:1px solid var(--b);border-radius:8px}
table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid var(--b);text-align:left}
td.n,th.n{text-align:right}.ok{color:var(--ok)}.no{color:var(--no)}.m{color:var(--m);font-size:14px}
</style></head><body><main>
<h1>Catálogo</h1><input id="q" placeholder="Buscar producto o código" oninput="r()">
<div class="w"><table><thead><tr><th>Código<th>Producto<th class="n">Precio<th class="n">Stock</tr></thead><tbody id="t"></tbody></table></div>
<p class="m" id="u"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const sb=supabase.createClient(CFG.URL,CFG.KEY);let P=[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>Number(n).toLocaleString('es',{minimumFractionDigits:2,maximumFractionDigits:2});
async function load(){const{data,error}=await sb.from('productos').select('codigo,nombre,precio,stock').order('nombre');
 if(error){document.getElementById('u').textContent='No se pudo cargar el catálogo.';return}
 P=data;r();document.getElementById('u').textContent='Actualizado a las '+new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})}
function r(){const q=document.getElementById('q').value.toLowerCase();
 document.getElementById('t').innerHTML=P.filter(p=>(p.codigo+' '+p.nombre).toLowerCase().includes(q)).map(p=>
 `<tr><td>${esc(p.codigo)}<td>${esc(p.nombre)}<td class="n">${eur(p.precio)}<td class="n ${p.stock>0?'ok':'no'}">${p.stock>0?p.stock:'Agotado'}</tr>`).join('')}
load();setInterval(load,60000);
</script></body></html>
