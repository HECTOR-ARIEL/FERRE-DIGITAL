<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogo</title>
<link rel="icon" href="icon.svg"><link rel="stylesheet" href="estilos.css"><meta name="theme-color" content="#0d0d0d">
<style>
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top input{flex:1;min-width:200px}
#mas{display:block;margin:18px auto 0}
</style></head><body>
<header><div class="brand"><img src="logo.jpg" alt="Distribuidor DEC"><h1 id="tit">Catálogo</h1></div>
<a class="btn s" href="admin.html">Administrar</a></header>
<main>
<div class="top"><input id="q" type="search" placeholder="Buscar por descripción o código" oninput="lim=48;r()"><span class="m" id="u"></span></div>
<div class="grid" id="g"></div>
<button id="mas" class="s" hidden onclick="lim+=48;r()">Ver más productos</button>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const sb=supabase.createClient(CFG.URL,CFG.KEY),$=id=>document.getElementById(id);let P=[],lim=48;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(CFG.MONEDA||'')+' '+Number(n).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const norm=s=>String(s??'').normalize('NFD').replace(/\p{M}/gu,'').toLowerCase();
if(CFG.NOMBRE)document.title=CFG.NOMBRE+' · Catálogo';
// Solo se muestran productos con código propio, visibles y fuera de la papelera.
// Supabase devuelve como máximo 1000 filas por consulta: pedimos por bloques
async function todos(q){let out=[];for(let i=0;;i+=1000){const{data,error}=await q().range(i,i+999);if(error)throw error;out=out.concat(data);if(data.length<1000)return out}}
async function load(){
 try{P=await todos(()=>sb.from('productos').select('id,codigo,nombre,precio,imagen,stock').eq('activo',true).eq('borrado',false).not('codigo','is',null).neq('codigo','').order('nombre'))}
 catch(e){$('u').textContent='No se pudo cargar el catálogo.';return}
 r();$('u').textContent=P.length+' productos'}
function r(){const w=norm($('q').value).split(/\s+/).filter(Boolean);
 const F=P.filter(p=>{const s=norm((p.codigo||'')+' '+p.nombre);return w.every(x=>s.includes(x))});
 $('g').innerHTML=F.slice(0,lim).map(p=>`<article class="card${p.stock>0?'':' agotado'}">
  <div class="img">${p.imagen?`<img loading="lazy" src="${esc(p.imagen)}" alt="${esc(p.nombre)}">`:'Sin imagen'}</div>
  <div class="b">${p.codigo?`<span class="cod">${esc(p.codigo)}</span>`:''}<h2>${esc(p.nombre)}</h2><span class="pr">${money(p.precio)}</span>${p.stock>0?'':'<span class="sin">Sin stock</span>'}</div></article>`).join('')
  ||`<p class="m" style="grid-column:1/-1">${P.length?'No hay productos que coincidan con la búsqueda.':'Todavía no hay productos en el catálogo.'}</p>`;
 $('mas').hidden=F.length<=lim}
// Cada 10 s pregunta si hubo cambios en administración; solo entonces recarga los productos
let ver;
async function revisa(){const{data}=await sb.from('cambios').select('ts').eq('id',1).maybeSingle();const v=data?.ts;if(!v||v!==ver){ver=v;load()}}
revisa();setInterval(()=>{if(!document.hidden)revisa()},10000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)revisa()});
</script></body></html>
